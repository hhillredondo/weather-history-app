name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these workflows only read the repo. Public repos default
# to a broader GITHUB_TOKEN, so state it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Static analysis
        run: dart analyze lib

      - name: Run Flutter tests
        run: flutter test

  lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/lambda/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/lambda/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lambda tests
        run: npm test
