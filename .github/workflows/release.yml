name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One release build at a time on main. Manual triggers from the Actions tab
  # also fall under this group, so a manual run won't race against a push.
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Static analysis (Dart)
        working-directory: app
        run: dart analyze lib

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/lambda/api/package-lock.json

      - name: Install Lambda deps
        working-directory: infrastructure/lambda/api
        run: npm ci

      - name: Lambda tests
        working-directory: infrastructure/lambda/api
        run: npm test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=upload
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build release APK
        # Build number = monotonically increasing GitHub run number, so each
        # release is treated as an upgrade by Android (not a downgrade).
        # Cognito + API URL are injected via --dart-define so the release APK
        # can talk to the backend (debug builds get the same values from
        # local .env / launch config).
        env:
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=COGNITO_REGION="$COGNITO_REGION" \
            --dart-define=COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" \
            --dart-define=COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: nightlies
          file: app/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Release build
            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}
