name: Nightly

on:
  schedule:
    # 02:00 UTC every day. GitHub may delay scheduled runs by a few minutes
    # depending on runner availability — this is fine for nightly tests.
    - cron: '0 2 * * *'
  workflow_dispatch:

# Least privilege: these workflows only read the repo. Public repos default
# to a broader GITHUB_TOKEN, so state it explicitly.
permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Static analysis (Dart)
        working-directory: app
        run: dart analyze lib

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/lambda/api/package-lock.json

      - name: Install Lambda deps
        working-directory: infrastructure/lambda/api
        run: npm ci

      - name: Lambda tests
        working-directory: infrastructure/lambda/api
        run: npm test
