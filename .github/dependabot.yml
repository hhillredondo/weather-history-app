version: 2
# Dependency scanning for a public repo: GitHub-native, no CI minutes.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: "/app"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/infrastructure/lambda/api"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
