AWSTemplateFormatVersion: '2010-09-09'
Description: Weather History App — Cognito, DynamoDB, HTTP API + Lambda stub (dev/prod via Environment parameter).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  ProjectName:
    Type: String
    Default: weather-history
  AllowedOrigins:
    Type: String
    Description: CORS allow origin for HTTP API (e.g. https://app.example.com or * for dev only).
    Default: '*'
  OpenMeteoApiKey:
    Type: String
    Description: Optional Open-Meteo customer API key (commercial/self-host). Leave empty for free public tier.
    Default: ''
    NoEcho: true

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      EmailVerificationSubject: 'Historical Weather — confirm your email'
      EmailVerificationMessage: |
        Welcome to Historical Weather!

        Your confirmation code is {####}.

        Enter this code in the Historical Weather app to finish creating your account.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'Historical Weather — confirm your email'
        EmailMessage: |
          Welcome to Historical Weather!

          Your confirmation code is {####}.

          Enter this code in the Historical Weather app to finish creating your account.

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Environment}-app'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-app'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AppTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt AppTable.Arn
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*'

  ApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-api'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 90
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          ENVIRONMENT: !Ref Environment
          USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          OPEN_METEO_BASE_URL: https://archive-api.open-meteo.com/v1/archive
          OPEN_METEO_API_KEY: !Ref OpenMeteoApiKey
          BEDROCK_MODEL_ID: eu.anthropic.claude-haiku-4-5-20251001-v1:0
          CHAT_DAILY_TOKEN_LIMIT: '200000'
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 200,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              ok: true,
              message: 'Replace with real bundle: infrastructure/lambda/build.sh then aws lambda update-function-code',
            }),
          });

  ApiLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-http'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiLambda.Arn
      PayloadFormatVersion: '2.0'

  HttpApiRouteProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /{proxy+}'
      Target: !Join
        - /
        - - integrations
          - !Ref HttpApiIntegration

  HttpApiRouteRoot:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /'
      Target: !Join
        - /
        - - integrations
          - !Ref HttpApiIntegration

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoIssuer'
  HttpApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-HttpApiUrl'
  AppTableName:
    Value: !Ref AppTable
    Export:
      Name: !Sub '${AWS::StackName}-AppTableName'
  ApiLambdaName:
    Value: !Ref ApiLambda
    Export:
      Name: !Sub '${AWS::StackName}-ApiLambdaName'
